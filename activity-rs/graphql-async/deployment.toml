[[activity_wasm]]
name = "{{crate_name}}"
location = "target/wasm32-wasip2/release/{{crate_name}}.wasm"
env_vars = [{ key = "GITHUB_GRAPHQL_URL", value = '${GITHUB_GRAPHQL_URL:-https://api.github.com/graphql}' }]
[[activity_wasm.allowed_host]]
pattern = "${GITHUB_GRAPHQL_ORIGIN:-https://api.github.com}"
methods = ["POST"]
secrets = ["GITHUB_TOKEN"]
replace_in = ["headers"]
